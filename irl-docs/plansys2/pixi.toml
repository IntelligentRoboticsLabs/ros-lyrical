[workspace]
name = "plansys2_examples"
channels = [
  "file:///home/fmrico/pixi/own-buildfarms/ros-lyrical/output",
  "https://prefix.dev/irl-lyrical",
  "https://prefix.dev/robostack-lyrical",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64"]

[dependencies]
# Base ROS dependencies
ros-lyrical-ros-base = "*"
ros-lyrical-ros2cli = "*"
ros-lyrical-nav2-msgs = "*"

# Prefer Zenoh middleware
ros-lyrical-rmw-zenoh-cpp = "*"

# CLI autocompletion for `ros2` (argcomplete)
argcomplete = "*"

# Build tools
colcon-common-extensions = "*"
cmake = "<4"
pkg-config = "*"
compilers = "*"
make = "*"
ninja = "*"

# PCL (and several ROS packages) still expect Eigen3 (3.x) config semantics.
# Pin the Eigen ABI package to avoid CMake falling back to system Eigen (/usr/include/eigen3).
eigen-abi-devel = "*"

# PlanSys2 runtime (from local output first, then remote channels)
ros-lyrical-plansys2-bringup = "*"
ros-lyrical-plansys2-bt-actions = "*"
ros-lyrical-plansys2-core = "*"
ros-lyrical-plansys2-domain-expert = "*"
ros-lyrical-plansys2-executor = "*"
ros-lyrical-plansys2-lifecycle-manager = "*"
ros-lyrical-plansys2-msgs = "*"
ros-lyrical-plansys2-pddl-parser = "*"
ros-lyrical-plansys2-planner = "*"
ros-lyrical-plansys2-popf-plan-solver = "*"
ros-lyrical-plansys2-problem-expert = "*"
ros-lyrical-plansys2-support-py = "*"
ros-lyrical-plansys2-terminal = "*"
ros-lyrical-plansys2-tools = "*"
ros-lyrical-plansys2-tui-cli = "*"

# POPF itself (needed by ros-lyrical-plansys2-popf-plan-solver)
ros-lyrical-popf = "*"


[tasks]
build = { cmd = "bash -lc 'colcon build --cmake-args -DEigen3_DIR=\"$CONDA_PREFIX/share/eigen3/cmake\"'", description = "Build the ROS workspace" }
test = { cmd = "bash -lc 'colcon test && colcon test-result --verbose'", description = "Run tests for the workspace" }
clean = { cmd = "rm -rf build install log", description = "Clean build artifacts (build, install, log directories)" }

[activation]
scripts = ["activate.sh"]
