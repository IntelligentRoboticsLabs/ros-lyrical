# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-moveit-task-constructor-demo
  version: 0.1.5
source:
  git: https://github.com/ros2-gbp/moveit_task_constructor-release.git
  tag: release/lyrical/moveit_task_constructor_demo/0.1.5-3
  target_directory: ros-lyrical-moveit-task-constructor-demo/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: BSD-3-Clause
  summary: demo tasks illustrating various capabilities of MTC.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-generate-parameter-library
    - ros-lyrical-moveit-core
    - ros-lyrical-moveit-ros-planning-interface
    - ros-lyrical-moveit-task-constructor-core
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.18.* lyrical_*
  run:
    - python
    - ros-lyrical-controller-manager
    - ros-lyrical-generate-parameter-library
    - ros-lyrical-moveit-configs-utils
    - ros-lyrical-moveit-core
    - ros-lyrical-moveit-resources-panda-moveit-config
    - ros-lyrical-moveit-ros-planning-interface
    - ros-lyrical-moveit-task-constructor-capabilities
    - ros-lyrical-moveit-task-constructor-core
    - ros-lyrical-moveit-task-constructor-visualization
    - ros-lyrical-py-binding-tools
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.18.* lyrical_*
