jobs:
  stage_0_job_0:
    name: rviz-marker-tools moveit-task-constructor-msgs teleop-tools-msgs key-teleop
      mouse-teleop
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros-lyrical-rviz-marker-tools ros-lyrical-moveit-task-constructor-msgs
        ros-lyrical-teleop-tools-msgs ros-lyrical-key-teleop ros-lyrical-mouse-teleop
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-lyrical-rviz-marker-tools ros-lyrical-moveit-task-constructor-msgs
          ros-lyrical-teleop-tools-msgs ros-lyrical-key-teleop ros-lyrical-mouse-teleop
        BUILD_TARGET: linux-aarch64
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
  stage_1_job_1:
    name: moveit-task-constructor-core joy-teleop
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    needs:
    - stage_0_job_0
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros-lyrical-moveit-task-constructor-core ros-lyrical-joy-teleop
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-lyrical-moveit-task-constructor-core ros-lyrical-joy-teleop
        BUILD_TARGET: linux-aarch64
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
  stage_2_job_2:
    name: moveit-task-constructor-visualization moveit-task-constructor-capabilities
      teleop-tools moveit-task-constructor-demo
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    needs:
    - stage_1_job_1
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros-lyrical-moveit-task-constructor-visualization ros-lyrical-moveit-task-constructor-capabilities
        ros-lyrical-teleop-tools ros-lyrical-moveit-task-constructor-demo
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-lyrical-moveit-task-constructor-visualization ros-lyrical-moveit-task-constructor-capabilities
          ros-lyrical-teleop-tools ros-lyrical-moveit-task-constructor-demo
        BUILD_TARGET: linux-aarch64
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
name: build_linux_aarch64
on:
  push:
    branches:
    - buildbranch_linux_aarch64
